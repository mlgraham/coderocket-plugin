name: content-guard

on: [push, pull_request]

jobs:
  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if debunked API-key claims reappear
        run: |
          patterns='will prompt you|Claude Code prompts|prompt you to enter|echo \$CODEROCKET_API_KEY'
          if grep -rniE "$patterns" . --exclude-dir=.git --exclude-dir=workflows --exclude=CHANGELOG.md; then
            echo "::error::Forbidden string above. Claude Code never prompts for CODEROCKET_API_KEY (the MCP server reads it from the environment at startup), and 'echo \$VAR' does not prove a variable is exported — use printenv."
            exit 1
          fi
          echo "content guard passed"
